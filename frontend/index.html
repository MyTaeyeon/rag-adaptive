<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive RAG System</title>
    <link rel="icon" type="image/jpeg" href="assets/page_icon.jpg">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* Chat message bubbles */
        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-left: auto;
        }
        
        .message.assistant .message-content {
            background: white;
            color: #1e293b;
            border: 1px solid #e2e8f0;
        }
        
        /* Markdown formatting */
        .message-text h2 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 1rem;
            margin-bottom: 0.5rem;
            color: inherit;
        }
        
        .message-text ul, .message-text ol {
            margin-left: 1.5rem;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
        }
        
        .message-text li {
            margin-bottom: 0.25rem;
        }
        
        .message-text code {
            background: rgba(0, 0, 0, 0.05);
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            font-family: 'Courier New', monospace;
        }
        
        .message.user .message-text code {
            background: rgba(255, 255, 255, 0.2);
        }
        
        /* Pipeline steps vertical line */
        .pipeline-step-item::before {
            content: '';
            position: absolute;
            left: 1.25rem;
            top: 2.5rem;
            bottom: -1rem;
            width: 2px;
            background: #e2e8f0;
        }
        
        .pipeline-step-item:last-child::before {
            display: none;
        }
        
        /* Custom dropdown */
        .custom-select {
            position: relative;
        }
        
        .custom-select select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
        }
        
        .custom-select::after {
            content: '\f078';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #64748b;
        }
        
        /* Loading spinner */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        
        /* Toggle icon rotation */
        .toggle-icon.rotated {
            transform: rotate(180deg);
        }
        
        /* Pipeline step expand/collapse */
        .pipeline-step-content.hidden {
            display: none;
        }
        
        /* Candidate expand/collapse */
        .candidate-item:not(.expanded) .candidate-content {
            display: none;
        }
        
        .candidate-item.expanded .candidate-header .candidate-score.fa-chevron-down {
            transform: rotate(180deg);
        }
        
        /* Collapsible section */
        .collapsible-content.active {
            display: block !important;
        }
        
        /* Left Sidebar Collapse */
        .left-sidebar {
            transition: width 0.3s ease;
        }
        
        .left-sidebar.collapsed {
            width: 60px !important;
        }
        
        .left-sidebar.collapsed .sidebar-content {
            display: none;
        }
        
        .left-sidebar.collapsed .sidebar-header h2 span,
        .left-sidebar.collapsed .sidebar-header .toggle-btn-text {
            display: none;
        }
        
        .left-sidebar.collapsed .sidebar-header {
            padding: 1rem;
            justify-content: center;
        }
        
        .left-sidebar.collapsed .sidebar-header h2 {
            justify-content: center;
        }
        
        .left-sidebar.collapsed .toggle-sidebar-btn {
            margin: 0 auto;
        }
        
        /* Resize Handle */
        .resize-handle {
            position: absolute;
            left: -4px;
            top: 0;
            bottom: 0;
            width: 8px;
            background: transparent;
            cursor: col-resize;
            z-index: 10;
            transition: background 0.2s;
        }
        
        .resize-handle:hover {
            background: #3b82f6;
        }
        
        .resize-handle.active {
            background: #2563eb;
        }
        
        .right-sidebar {
            position: relative;
            transition: none;
        }
        
        .right-sidebar.resizing {
            transition: none;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">
    <div class="flex h-screen overflow-hidden">
        <!-- Left Sidebar: Collections Management (20%) -->
        <aside id="left-sidebar" class="left-sidebar w-[20%] bg-white border-r border-slate-200 flex flex-col overflow-hidden">
            <div class="sidebar-header p-6 border-b border-slate-200 flex items-center justify-between">
                <h2 class="text-xl font-semibold text-slate-800 flex items-center gap-2">
                    <i class="fas fa-database text-indigo-600"></i>
                    <span>Collections</span>
                </h2>
                <button onclick="toggleLeftSidebar()" 
                        class="toggle-sidebar-btn p-2 hover:bg-slate-100 rounded-lg transition-colors"
                        title="Toggle Sidebar">
                    <i class="fas fa-chevron-left text-slate-600"></i>
                </button>
            </div>
            
            <div class="sidebar-content flex-1 overflow-y-auto p-4 space-y-4">
                <!-- Create Collection Section -->
                <div class="bg-slate-50 rounded-xl p-4 border border-slate-200">
                    <button class="toggle-btn w-full flex items-center justify-between text-left font-medium text-slate-700 hover:text-slate-900 transition-colors" onclick="toggleSection('create-collection')">
                        <span class="flex items-center gap-2">
                            <i class="fas fa-plus-circle text-indigo-600"></i>
                            Create Collection
                        </span>
                        <i class="fas fa-chevron-down toggle-icon text-slate-400 transition-transform"></i>
                    </button>
                    <div id="create-collection" class="collapsible-content mt-4 space-y-3" style="display: none;">
                        <input type="text" id="new-collection-name" placeholder="Collection Name" 
                               class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm">
                        <div class="custom-select">
                            <select id="new-collection-lang" 
                                    class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm bg-white cursor-pointer">
                                <option value="en">English</option>
                                <option value="vi">Vietnamese</option>
                            </select>
                        </div>
                        <button onclick="createCollection()" 
                                class="w-full px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
                            <i class="fas fa-check"></i>
                            Create
                        </button>
                    </div>
                </div>
                
                <!-- Divider -->
                <div class="border-t border-slate-200"></div>
                
                <!-- Collection Selector -->
                <div class="space-y-2">
                    <label for="collection-select" class="block text-sm font-medium text-slate-700">
                        <i class="fas fa-folder-open mr-2 text-slate-500"></i>
                        Select Collection
                    </label>
                    <div class="custom-select">
                        <select id="collection-select" onchange="onCollectionChange()"
                                class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm bg-white cursor-pointer">
                            <option value="">-- Select Collection --</option>
                        </select>
                    </div>
                </div>
                
                <!-- Collection Info -->
                <div id="collection-info" class="space-y-4" style="display: none;">
                    <!-- Collection Stats -->
                    <div class="bg-gradient-to-br from-indigo-50 to-purple-50 rounded-xl p-4 border border-indigo-100">
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-white rounded-lg p-3 border border-indigo-100">
                                <div class="text-xs text-slate-500 mb-1">Language</div>
                                <div id="collection-lang" class="text-sm font-semibold text-slate-800">-</div>
                            </div>
                            <div class="bg-white rounded-lg p-3 border border-indigo-100">
                                <div class="text-xs text-slate-500 mb-1">Chunks</div>
                                <div id="collection-chunks" class="text-sm font-semibold text-slate-800">-</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Adaptive Iterations Selector -->
                    <div class="space-y-2">
                        <label for="adaptive-n" class="block text-sm font-medium text-slate-700">
                            <i class="fas fa-sliders-h mr-2 text-slate-500"></i>
                            Adaptive Iterations (n)
                        </label>
                        <div class="custom-select">
                            <select id="adaptive-n"
                                    class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm bg-white cursor-pointer">
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                                <option value="6">6</option>
                                <option value="7">7</option>
                                <option value="8">8</option>
                                <option value="9">9</option>
                                <option value="10">10</option>
                            </select>
                        </div>
                        <small class="text-xs text-slate-500 block">Number of non-hop LLM calls to calculate entropy (1-10)</small>
                    </div>
                    
                    <!-- Divider -->
                    <div class="border-t border-slate-200"></div>
                    
                    <!-- File Upload -->
                    <div class="space-y-3">
                        <label for="file-upload" class="block text-sm font-medium text-slate-700">
                            <i class="fas fa-upload mr-2 text-slate-500"></i>
                            Upload Documents
                        </label>
                        <input type="file" id="file-upload" multiple accept=".pdf,.docx,.txt" 
                               class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-sm file:font-medium file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
                        <button onclick="uploadFiles()" 
                                class="w-full px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
                            <i class="fas fa-cloud-upload-alt"></i>
                            Upload
                        </button>
                        <div id="upload-progress" class="w-full space-y-2" style="display: none;">
                            <div class="bg-slate-200 rounded-full h-2 overflow-hidden">
                                <div class="progress-fill h-full bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full transition-all duration-300" style="width: 0%;"></div>
                            </div>
                            <div class="progress-text text-xs text-slate-600 text-center"></div>
                        </div>
                    </div>
                    
                    <!-- Collection Documents List -->
                    <div id="collection-documents" class="space-y-2" style="display: none;">
                        <div class="border-t border-slate-200 pt-4"></div>
                        <h4 class="text-sm font-semibold text-slate-800 mb-2">
                            <i class="fas fa-file-alt mr-2 text-indigo-600"></i>
                            Collection Info
                        </h4>
                        <div id="documents-list" class="text-xs text-slate-600 space-y-1"></div>
                    </div>
                    
                    <!-- Delete Collection -->
                    <div class="border-t border-slate-200 pt-4">
                        <button onclick="deleteCollection()" 
                                class="w-full px-4 py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-lg font-medium transition-colors flex items-center justify-center gap-2">
                            <i class="fas fa-trash-alt"></i>
                            Delete Collection
                        </button>
                    </div>
                </div>
            </div>
        </aside>
        
        <!-- Main Chat Area (55%) -->
        <main class="flex-1 flex flex-col overflow-hidden" style="width: 55%;">
            <div class="bg-white border-b border-slate-200 p-4 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                        <i class="fas fa-comments text-indigo-600"></i>
                        Chat
                    </h1>
                    <button onclick="newChat()" 
                            class="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium transition-colors flex items-center gap-2 text-sm"
                            title="Start New Chat">
                        <i class="fas fa-plus"></i>
                        <span>New Chat</span>
                    </button>
                </div>
                <!-- Model Selector -->
                <div class="flex items-center gap-3">
                    <label for="model-select" class="text-sm font-medium text-slate-700">Model:</label>
                    <div class="custom-select">
                        <select id="model-select"
                                class="px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm bg-white cursor-pointer min-w-[200px]">
                            <option value="">-- Select Model --</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <div class="flex-1 overflow-y-auto p-6 bg-slate-50" id="chat-messages">
                <div class="welcome-message text-center py-12">
                    <i class="fas fa-comment-dots text-4xl text-slate-400 mb-4"></i>
                    <p class="text-slate-600">Please select or create a collection from the sidebar to start chatting.</p>
                </div>
            </div>
            
            <div class="bg-white border-t border-slate-200 p-4">
                <div class="flex items-center gap-3">
                    <input type="text" id="chat-input" placeholder="Ask a question..." 
                           onkeypress="handleChatInputKeyPress(event)"
                           class="flex-1 px-4 py-3 border border-slate-300 rounded-full focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm">
                    <button onclick="sendMessage()" 
                            class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full font-medium transition-colors flex items-center gap-2 shadow-lg shadow-indigo-500/30 hover:shadow-xl hover:shadow-indigo-500/40">
                        <i class="fas fa-paper-plane"></i>
                        Send
                    </button>
                </div>
            </div>
        </main>
        
        <!-- Right Sidebar: Pipeline Steps (25%) -->
        <aside id="right-sidebar" class="right-sidebar w-[25%] bg-white border-l border-slate-200 flex flex-col overflow-hidden">
            <div class="resize-handle" id="resize-handle"></div>
            <div class="p-4 border-b border-slate-200">
                <h3 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                    <i class="fas fa-project-diagram text-indigo-600"></i>
                    Pipeline Steps
                </h3>
            </div>
            
            <div class="flex-1 overflow-y-auto p-4">
                <div id="pipeline-selector" class="mb-4" style="display: none;">
                    <label for="query-select" class="block text-sm font-medium text-slate-700 mb-2">
                        <i class="fas fa-search mr-2 text-slate-500"></i>
                        Select Query
                    </label>
                    <div class="custom-select">
                        <select id="query-select" onchange="onQuerySelect()"
                                class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all text-sm bg-white cursor-pointer">
                            <option value="">-- Select Query --</option>
                        </select>
                    </div>
                </div>
                
                <div id="pipeline-steps" class="space-y-4">
                    <div class="info-message text-center py-8 text-slate-500 text-sm">
                        <i class="fas fa-info-circle text-2xl mb-3 text-slate-400"></i>
                        <p>Pipeline steps will appear here after you ask a question.</p>
                    </div>
                </div>
            </div>
        </aside>
    </div>
    
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50" style="display: none;">
        <div class="bg-white rounded-2xl p-8 shadow-2xl flex flex-col items-center gap-4">
            <div class="spinner w-12 h-12"></div>
            <p class="text-slate-700 font-medium">Processing...</p>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        // Enhanced JavaScript for styling messages and pipeline steps
        // This will be called by app.js functions
        
        // Override addMessage to add Tailwind classes
        const originalAddMessage = window.addMessage;
        if (typeof originalAddMessage === 'undefined') {
            // Function will be defined in app.js, we'll enhance it after DOM loads
            document.addEventListener('DOMContentLoaded', function() {
                enhanceMessageStyling();
                enhancePipelineStyling();
            });
        }
        
        function enhanceMessageStyling() {
            // This will be called after messages are added
            const observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    mutation.addedNodes.forEach(function(node) {
                        if (node.nodeType === 1 && node.classList && node.classList.contains('message')) {
                            styleMessage(node);
                        }
                    });
                });
            });
            
            const messagesContainer = document.getElementById('chat-messages');
            if (messagesContainer) {
                observer.observe(messagesContainer, { childList: true });
                // Style existing messages
                messagesContainer.querySelectorAll('.message').forEach(styleMessage);
            }
        }
        
        function styleMessage(messageDiv) {
            // Remove old classes and add Tailwind classes
            messageDiv.className = 'message flex items-start gap-3 mb-4 ' + (messageDiv.dataset.role || '');
            
            const avatar = messageDiv.querySelector('.message-avatar');
            if (avatar) {
                avatar.className = 'message-avatar w-10 h-10 rounded-full object-cover flex-shrink-0 shadow-sm';
            }
            
            const contentDiv = messageDiv.querySelector('.message-content');
            if (contentDiv) {
                contentDiv.className = 'message-content max-w-[80%] rounded-2xl px-4 py-3 shadow-sm';
            }
            
            const textDiv = messageDiv.querySelector('.message-text');
            if (textDiv) {
                textDiv.className = 'message-text text-sm leading-relaxed break-words';
            }
            
            const timeDiv = messageDiv.querySelector('.message-time');
            if (timeDiv) {
                timeDiv.className = 'message-time text-xs mt-2 opacity-70';
            }
        }
        
        function enhancePipelineStyling() {
            // Enhance pipeline steps rendering
            const originalRenderPipelineSteps = window.renderPipelineSteps;
            if (originalRenderPipelineSteps) {
                // We'll enhance the HTML output in app.js
            }
        }
        
        // Enhanced toggleSection function
        function toggleSection(sectionId) {
            const section = document.getElementById(sectionId);
            const button = section.previousElementSibling;
            const icon = button?.querySelector('.toggle-icon');
            if (section) {
                section.classList.toggle('active');
                if (icon) {
                    icon.classList.toggle('rotated');
                }
            }
        }
        
        // Make toggleSection available globally
        window.toggleSection = toggleSection;
        
        // Toggle Left Sidebar (Collections)
        function toggleLeftSidebar() {
            const sidebar = document.getElementById('left-sidebar');
            const toggleBtn = sidebar.querySelector('.toggle-sidebar-btn i');
            
            sidebar.classList.toggle('collapsed');
            
            // Rotate icon
            if (sidebar.classList.contains('collapsed')) {
                toggleBtn.classList.remove('fa-chevron-left');
                toggleBtn.classList.add('fa-chevron-right');
            } else {
                toggleBtn.classList.remove('fa-chevron-right');
                toggleBtn.classList.add('fa-chevron-left');
            }
        }
        
        // Resize Right Sidebar (Pipeline Steps)
        (function() {
            const sidebar = document.getElementById('right-sidebar');
            const handle = document.getElementById('resize-handle');
            const minWidth = 250;
            const maxWidth = 600;
            
            let isResizing = false;
            let startX = 0;
            let startWidth = 0;
            
            if (!sidebar || !handle) return;
            
            handle.addEventListener('mousedown', function(e) {
                isResizing = true;
                startX = e.clientX;
                startWidth = sidebar.offsetWidth;
                handle.classList.add('active');
                sidebar.classList.add('resizing');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                e.preventDefault();
                e.stopPropagation();
            });
            
            document.addEventListener('mousemove', function(e) {
                if (!isResizing) return;
                
                const diff = startX - e.clientX; // Negative when dragging left (expanding sidebar)
                let newWidth = startWidth + diff;
                
                // Enforce min/max constraints
                if (newWidth < minWidth) newWidth = minWidth;
                if (newWidth > maxWidth) newWidth = maxWidth;
                
                sidebar.style.width = newWidth + 'px';
                sidebar.style.flexShrink = '0';
                sidebar.style.flexGrow = '0';
            });
            
            document.addEventListener('mouseup', function() {
                if (isResizing) {
                    isResizing = false;
                    handle.classList.remove('active');
                    sidebar.classList.remove('resizing');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                }
            });
        })();
    </script>
</body>
</html>
